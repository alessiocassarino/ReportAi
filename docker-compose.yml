services:

  # ─────────────────────────────────────────────
  # 1. DATABASE  –  PostgreSQL + pgvector
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: report-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: vector_db
    ports:
      - "5400:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-extensions.sql:ro
    networks:
      - report-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 2. OLLAMA  –  motore AI locale per embeddings
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: report-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - report-ai-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 3. OLLAMA INIT  –  scarica il modello al primo avvio
  #    Si avvia una volta sola e poi si ferma (restart: no).
  #    Se il modello è già presente, il comando termina subito.
  # ─────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: report-ai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "mxbai-embed-large:latest"]
    networks:
      - report-ai-network
    restart: "no"

  # ─────────────────────────────────────────────
  # 4. BACKEND  –  Spring Boot
  # ─────────────────────────────────────────────
  spring-boot:
    build: .
    container_name: report-ai-backend
    environment:
      # Database (usa il nome del servizio Docker, non localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vector_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      # Ollama (usa il nome del servizio Docker, non localhost)
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      # Percorsi file interni al container
      APP_STORAGE_ROOT: /app/data/uploads
      APP_REPORT_LOGO_PATH: /app/data/logo.png
      # Chiavi API – lette dal file .env nella stessa cartella
      SPRING_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - report-ai-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 5. FRONTEND  –  React servito da Nginx
  #    Metti i file compilati in:  ./frontend/dist/
  # ─────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: report-ai-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-boot
    networks:
      - report-ai-network
    restart: unless-stopped

networks:
  report-ai-network:
    driver: bridge

volumes:
  # ─────────────────────────────────────────────────────────────────
  # NOTA IMPORTANTE PER LO SVILUPPO:
  # ─────────────────────────────────────────────────────────────────
  # 
  # Durante lo SVILUPPO, per aggiornare il backend senza perdere i dati:
  #   1. docker-compose down        (senza -v, per preservare i volumi)
  #   2. (modifica il codice)
  #   3. docker-compose build spring-boot
  #   4. docker-compose up -d
  #
  # I volumi rimangono, quindi Ollama non deve rifare il download
  # e il database mantiene le tabelle create da Liquibase.
  #
  # Per una CLEAN SLATE (test/staging):
  #   docker-compose down -v        (rimuove anche i volumi)
  # ─────────────────────────────────────────────────────────────────
  postgres_data:
  ollama_data:
