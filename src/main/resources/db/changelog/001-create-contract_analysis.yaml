databaseChangeLog:
  - changeSet:
      id: 001-create-contract_analysis
      author: reportAi
      changes:
        - createTable:
            tableName: contract_analysis
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: progress
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: current_step
                  type: TEXT
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: result_file_name
                  type: VARCHAR(255)
              - column:
                  name: result_file_content
                  type: BYTEA
              - column:
                  name: model
                  type: VARCHAR(255)
                  defaultValue: claude-haiku-4-5-20251001
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
