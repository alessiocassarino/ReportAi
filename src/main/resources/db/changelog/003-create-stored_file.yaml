databaseChangeLog:
  - changeSet:
      id: 003-create-stored_file
      author: reportAi
      changes:
        - createTable:
            tableName: stored_file
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: original_filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(255)
              - column:
                  name: sha256
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: storage_path
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: extracted_text
                  type: TEXT
              - column:
                  name: extraction_status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: metadata_json
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
