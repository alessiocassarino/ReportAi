spring.application.name=reportAi

# Carica automaticamente il file .env dalla root del progetto (se esiste)
spring.config.import=optional:dotenv:.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5400/vector_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - SQL migrations for security tables
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.options.max-tokens=8192
spring.ai.anthropic.connection-timeout=30s
spring.ai.chat.client.enabled=false


spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=mxbai-embed-large:latest
spring.ai.ollama.embedding.options.truncate=true
spring.ai.ollama.chat.enabled=false

# Google Vertex AI Gemini
spring.ai.vertex.ai.gemini.project-id=${GOOGLE_CLOUD_PROJECT_ID:progetto-ai-494215}
spring.ai.vertex.ai.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.credentials.location=${GOOGLE_APPLICATION_CREDENTIALS_PATH:classpath:config/progetto-ai-494215-1a94e8abc771.json}
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.0-flash
spring.ai.vertex.ai.gemini.chat.options.temperature=0.2

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

app.storage.root=./data/uploads

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

logging.level.org.springframework.ai=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.apache.pdfbox.contentstream.PDFStreamEngine=ERROR

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.transaction=ERROR
logging.level.com.zaxxer.hikari=ERROR

# Tavily Web Search
tavily.api-key=${TAVILY_API_KEY}
tavily.base-url=https://api.tavily.com
tavily.max-results-per-query=5

# Report Generation
app.report.logo-path=./data/logo.png
app.report.company-name=NEXONIQ

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-in-production-minimum-64-chars-hs512-ok!}
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5174,http://localhost
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

