spring.application.name=reportAi

# Carica automaticamente il file .env dalla root del progetto (se esiste)
spring.config.import=optional:dotenv:.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5400/vector_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - SQL migrations for security tables
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.options.max-tokens=8192
spring.ai.anthropic.connection-timeout=30s
spring.ai.chat.client.enabled=false


spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=mxbai-embed-large:latest
spring.ai.ollama.embedding.options.truncate=true
spring.ai.ollama.chat.enabled=false

# Google Vertex AI Gemini
spring.ai.vertex.ai.gemini.project-id=${GOOGLE_CLOUD_PROJECT_ID:progetto-ai-494215}
spring.ai.vertex.ai.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.credentials.location=${GOOGLE_APPLICATION_CREDENTIALS_PATH:classpath:config/progetto-ai-494215-1a94e8abc771.json}
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.0-flash
spring.ai.vertex.ai.gemini.chat.options.temperature=0.2

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

app.storage.root=./data/uploads

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

logging.level.org.springframework.ai=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.apache.pdfbox.contentstream.PDFStreamEngine=ERROR

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.transaction=ERROR
logging.level.com.zaxxer.hikari=ERROR

# Tavily Web Search
tavily.api-key=${TAVILY_API_KEY}
tavily.base-url=https://api.tavily.com
tavily.max-results-per-query=2
# Comma-separated list of domains blocked at API level and post-filtered from results
tavily.denylist-domains=huggingface.co,reddit.com,quora.com,stackoverflow.com,youtube.com,github.com,arxiv.org,medium.com,wikipedia.org,twitter.com,x.com,linkedin.com,facebook.com,instagram.com,tiktok.com

# Report Generation
app.report.logo-path=./data/logo.png
app.report.company-name=NEXONIQ

# Immagini PDF inviate ai modelli multimodali.
# L'estrattore crea al massimo 5 tavole composite: prima prova a raccogliere
# figure/immagini reali dal PDF, poi fa fallback su pagine rappresentative.
app.pdf-images.dpi=100
app.pdf-images.jpeg-quality=0.72
app.pdf-images.max-source-pages=10
app.pdf-images.max-output-images=5
app.pdf-images.max-embedded-images=40
app.pdf-images.min-embedded-width=250
app.pdf-images.min-embedded-height=120
app.pdf-images.min-embedded-area=100000

# Modelli usati per le fasi di estrazione (ProjectInfo, Exclusions) — sempre veloci/economici
# indipendentemente dal modello principale scelto dall'utente.
app.estimate.extractor-model.anthropic=claude-haiku-4-5-20251001
app.estimate.extractor-model.gemini=gemini-2.5-flash

# Cambio EUR/USD per preventivi e logging costi AI.
# Frankfurter usa dati BCE, non richiede API key e viene cachato lato applicazione.
app.exchange-rate.base-url=https://api.frankfurter.app
app.exchange-rate.cache-ttl=PT6H
app.exchange-rate.fallback-usd-per-eur=1.15

# Listini pubblici USD per milione di token (input/output).
# Anthropic: cache write = 1.25x input, cache read = 0.10x input (calcolati nell'advisor).
# Aggiornare quando i listini cambiano sui siti dei provider.
app.pricing.models.claude-haiku-4-5-20251001.input=1.0
app.pricing.models.claude-haiku-4-5-20251001.output=5.0
app.pricing.models.claude-sonnet-4-5.input=3.0
app.pricing.models.claude-sonnet-4-5.output=15.0
app.pricing.models.claude-sonnet-4-6.input=3.0
app.pricing.models.claude-sonnet-4-6.output=15.0
app.pricing.models.claude-opus-4-6.input=15.0
app.pricing.models.claude-opus-4-6.output=75.0
app.pricing.models.claude-opus-4-7.input=15.0
app.pricing.models.claude-opus-4-7.output=75.0
# Gemini 2.5: tariffa standard, fino a 200K token di contesto.
app.pricing.models.gemini-2.5-flash.input=0.30
app.pricing.models.gemini-2.5-flash.output=2.50
app.pricing.models.gemini-2.5-flash-lite.input=0.10
app.pricing.models.gemini-2.5-flash-lite.output=0.40
app.pricing.models.gemini-2.5-pro.input=1.25
app.pricing.models.gemini-2.5-pro.output=10.0

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-in-production-minimum-64-chars-hs512-ok!}
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5174,http://localhost
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

