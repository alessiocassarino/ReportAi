spring.application.name=reportAi

# Test database configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Liquibase for tests
spring.liquibase.enabled=false

# Disable Flyway for tests (we'll use Hibernate DDL)
spring.flyway.enabled=false

# JWT Configuration for tests
app.jwt.secret=test-secret-key-min-32-characters-for-testing-purpose-only
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# CORS Configuration for tests
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Logging
logging.level.root=INFO
logging.level.com.claude.reportAi=DEBUG

